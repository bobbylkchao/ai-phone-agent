# CI for pull requests: Prettier, ESLint, Jest coverage, type-check build, and dependency audit.
# "Require PR before merge" is configured in GitHub → Settings → Branches (see doc/github-ci.md).

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prettier
        run: npm run format

      - name: Commit and push formatting (same-repo PRs only)
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No Prettier changes."
            exit 0
          fi
          git add -A
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error title=Formatting required::Prettier changed files. Fork PRs cannot receive pushes from Actions. Run \`npm run format\` locally and push to your branch."
            exit 1
          fi
          git commit -m "style: apply Prettier (automated)"
          git push

  lint:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch (latest, includes any format push)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high and critical)
        run: npm audit --audit-level=high

      - name: ESLint (fail on errors or warnings)
        run: npm run lint:ci

      - name: Jest unit tests with coverage
        run: npm run test:ci

      - name: Type-check and build
        run: npm run build

  node-22:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head branch (latest, includes any format push)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false

      - name: Setup Node.js 22 (minimum supported major)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Jest unit tests
        run: npm test

      - name: Type-check and build
        run: npm run build
